name: Research contracts and archived analyses
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s analysis -p 'test*.py' -v
      - run: if (Test-Path data/player-development-001-role/main.jsonl) { python analysis/review_playerdev001.py role }
      - run: python analysis/verify_matches.py
      - run: python analysis/verify_tact001p0.py
      - run: python analysis/verify_tact001p1b.py
      - run: python analysis/verify_tact001p1c.py
      - run: python analysis/verify_tact002r0.py
      - run: python analysis/review_tact002.py
      - run: python analysis/verify_round3_archive.py
      - run: python analysis/verify_night_archive.py
      - run: if (Test-Path data/attr-009-bridge/manifest.json) { python analysis/verify_attr009.py }
      - run: if (Test-Path data/attr-009-bridge/effects.json) { python analysis/review_round3.py results }
      - run: if (Test-Path data/mech-003-stamina/manifest.json) { python analysis/verify_mech003_archive.py }
      - run: if (Test-Path data/mech-002-startpolicy-tech/technical-summary.json) { python -B analysis/review_night001.py --public-startpolicy }
      - run: if (Test-Path data/mech-002-sharpness-p0/technical.jsonl) { python -B analysis/review_sharpness002_results.py public-technical }
      - run: if (Test-Path data/mech-002-sharpness-p0/main.jsonl) { python -B analysis/review_sharpness002_results.py public-main }
      - run: if (Test-Path data/night-002-split004/technical.jsonl) { python -B analysis/review_split004.py public-technical }
      - run: if (Test-Path data/night-002-split004/main.jsonl) { python -B analysis/review_split004.py public-main }
      - run: if (Test-Path data/night-002-split004/termination.json) { python -B analysis/review_split004.py public-terminal }
      - run: if (Test-Path data/night-002-stless003/technical.jsonl) { python -B analysis/review_stless003.py public-technical }
      - run: if (Test-Path data/night-002-stless003/main.jsonl) { python -B analysis/review_stless003.py public-main }
      - run: git diff --check
