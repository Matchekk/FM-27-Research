name: Research contracts and archived analyses
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s analysis -p 'test*.py' -v
      - run: python analysis/verify_matches.py
      - run: python analysis/verify_tact001p0.py
      - run: python analysis/verify_tact001p1b.py
      - run: python analysis/verify_tact001p1c.py
      - run: python analysis/verify_tact002r0.py
      - run: python analysis/review_tact002.py
      - run: python analysis/verify_round3_archive.py
      - run: if (Test-Path data/attr-009-bridge/manifest.json) { python analysis/verify_attr009.py }
      - run: git diff --check
